
services:
  frontend:
    build: .
    command: bash -c "streamlit run frontend/main.py --server.port 8081"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server:/code/server
      - ./frontend:/code/frontend
    ports:
      - "8081:8081"
  postgres:
    image: postgres:latest
    container_name: postgres_container1
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:  
      - ${POSTGRES_EXPOSED_PORT}:${POSTGRES_PORT}
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_container
    working_dir: /code
    command: >
      sh -c "uvicorn server.app:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PYTHONUNBUFFERED: "1"
      DOCKER_ENV: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-movies_db}
    depends_on:
    - postgres
    volumes:
      - ./server:/code/server
      - ./frontend:/code/frontend
      - ./scripts:/code/scripts
      - ./.env:/code/.env
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./data:/code/data
    ports:
      - "8000:8000"

volumes:
  pgdata:
